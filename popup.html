<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CopyPasta</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <div class="header">
        <svg class="header-icon" width="20" height="20" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="#FFF6E6" d="M2 8h12v1h-12zM2 9h2v1h-2zM5 9h6v1h-6zM12 9h2v1h-2zM2 10h1v1h-1zM4 10h3v1h-3zM9 10h3v1h-3zM13 10h1v1h-1zM3 11h10v1h-10zM4 12h8v1h-8z"/>
          <path fill="#FFCF5C" d="M6 4h1v1h-1zM9 4h1v1h-1zM4 5h8v1h-8zM3 6h10v1h-10z"/>
          <path fill="#E8553D" d="M7 3h2v1h-2zM7 4h2v1h-2zM2 7h12v1h-12z"/>
          <path fill="#FF8FA3" d="M3 10h1v1h-1zM12 10h1v1h-1z"/>
          <path fill="#5FA35A" d="M7 2h2v1h-2z"/>
          <path fill="#120E14" d="M6 3h1v1h-1zM9 3h1v1h-1zM4 4h2v1h-2zM10 4h2v1h-2zM3 5h1v1h-1zM12 5h1v1h-1zM2 6h1v1h-1zM13 6h1v1h-1zM1 7h1v1h-1zM14 7h1v1h-1zM1 8h1v1h-1zM14 8h1v1h-1zM1 9h1v1h-1zM4 9h1v1h-1zM11 9h1v1h-1zM14 9h1v1h-1zM1 10h1v1h-1zM7 10h2v1h-2zM14 10h1v1h-1zM2 11h1v1h-1zM13 11h1v1h-1zM3 12h1v1h-1zM12 12h1v1h-1zM4 13h8v1h-8zM6 14h4v1h-4z"/>
        </svg>
        <span class="header-title">CopyPasta</span>
      </div>

      <!-- Main Body -->
      <div class="body">
        <div id="view-no-web" class="no-web-box view-hidden">
          <p>Navigate to a website to enable CopyPasta for it.</p>
        </div>

        <div id="view-site" class="view-hidden">
          <!-- Top Row: Hostname and Switch -->
          <div class="site-row">
            <div class="site-info">
              <p id="site-hostname" class="site-hostname"></p>
              <p id="site-origin" class="site-origin"></p>
            </div>
            <button id="site-toggle" class="switch" role="switch" aria-checked="false" aria-label="Toggle CopyPasta for this site">
              <span class="switch-thumb"></span>
            </button>
          </div>

          <!-- Status Row -->
          <div class="status-row">
            <span id="status-badge" class="badge"></span>
            <span id="status-desc" class="status-desc"></span>
          </div>

          <!-- Reload Hint Banner -->
          <div id="reload-hint" class="reload-hint view-hidden">
            <span>Reload the page if paste doesn't take effect immediately.</span>
          </div>
        </div>
      </div>

      <!-- Accordion Drawer: Manage Sites -->
      <button id="drawer-toggle" class="drawer-toggle" aria-expanded="false" aria-controls="drawer-panel">
        <span id="drawer-count">Enabled sites (0)</span>
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="drawer-panel" class="drawer-panel">
        <div id="drawer-list" class="drawer-list"></div>
        <div id="drawer-empty" class="empty-drawer view-hidden">
          No sites configured yet.
        </div>
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
